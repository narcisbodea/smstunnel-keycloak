# The text message itself. Placeholders: {code}, {realm} (the realm's display name) and {ttl} (minutes).
# The code must stand on its own, and the text must stay under 320 characters.
smstunnelSmsText={code} is your {realm} sign-in code. It expires in {ttl} minutes.
smstunnelPhoneSmsText={code} is your code to confirm this phone number for {realm}.
