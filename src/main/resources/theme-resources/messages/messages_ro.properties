# SMS-ul. Fără diacritice: un singur caracter cu diacritice face din el două SMS-uri (UCS-2, 70 de caractere pe SMS).
# Locuri de completat: {code}, {realm} (numele afișat al realm-ului) și {ttl} (minute).
smstunnelSmsText={code} este codul tau de conectare la {realm}. Expira in {ttl} minute.
smstunnelPhoneSmsText={code} este codul tau pentru confirmarea acestui numar la {realm}.
